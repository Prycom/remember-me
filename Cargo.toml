[package]
name = "remember-me"
version = "0.1.0"
edition = "2024"
default-run = "remember-me"

[features]
default = ["client"]
client = [
    "dep:image", "dep:ratatui", "dep:crossterm", "dep:cpal", "dep:opusic-sys",
    "dep:chacha20poly1305", "dep:x25519-dalek", "dep:sha2",
    "dep:serde", "dep:toml", "dep:libc", "dep:nnnoiseless", "dep:unicode-width",
    "tokio/sync", "tokio/signal", "tokio/fs", "tokio/io-util",
]

[[bin]]
name = "remember-me"
path = "src/main.rs"
required-features = ["client"]

[[bin]]
name = "remember-me-server"
path = "src/bin/server.rs"

[[example]]
name = "cap_probe"
required-features = ["client"]

[[example]]
name = "pulse_probe"
required-features = ["client"]

[dependencies]
unicode-width = { version = "0.2.2", optional = true }
ratatui = { version = "0.30", optional = true }
crossterm = { version = "0.29", optional = true }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time"] }
cpal = { version = "0.18", features = ["pulseaudio"], optional = true }
# The desktop client links system libopus; the relay does not include audio.
opusic-sys = { version = "0.7.5", default-features = false, optional = true }
chacha20poly1305 = { version = "0.11", default-features = false, features = ["alloc"], optional = true }
x25519-dalek = { version = "3", features = ["static_secrets"], optional = true }
sha2 = { version = "0.11", optional = true }
serde = { version = "1", features = ["derive"], optional = true }
toml = { version = "1", optional = true }
argh = "0.1.19"
libc = { version = "0.2", optional = true }
nnnoiseless = { version = "=0.5.2", default-features = false, optional = true }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif"], optional = true }

[profile.release]
opt-level = 3
